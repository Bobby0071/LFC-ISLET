name: Release

# Fires only on version tags (v1.0.0, ...). Builds Windows installers and
# publishes a GitHub Release with notes from docs/releases/<tag>.md.
# Uses the workflow's built-in GITHUB_TOKEN -- no personal token needed.
# Deliberately does NOT run scripts/release/release.mjs: this fork keeps the
# in-app updater disabled, so no latest.json / signing / update channel is made.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "Tag $tag does not match package.json version $pkg" }
          Write-Output "Version OK: $pkg"

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $src = "docs/releases/$tag.md"
          if (-not (Test-Path $src)) { throw "Missing release notes: $src" }
          $body = Get-Content $src -Raw
          # Keep the body out of argv (multiline and contains quotes).
          $out = [System.IO.Path]::Combine($env:RUNNER_TEMP, "release-body.md")
          [System.IO.File]::WriteAllText($out, $body, [System.Text.UTF8Encoding]::new($false))
          "body_path=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: LFC-ISLET ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
